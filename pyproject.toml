[project]
name = "mini-agent-eval-harness"
version = "0.1.0"
description = " A minimal harness for evaluating LLM/agent outputs on small coding tasks"
requires-python = ">=3.10"

dependencies = [
    "pytest",
    "pytest-cov"
]
[tool.pytest.ini_options]
pythonpath = ["."]


[tool.setuptools]
packages = ["harness"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"